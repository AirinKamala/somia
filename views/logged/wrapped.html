<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="/lib/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/lib/swiper/swiper-bundle.css">
<script src="/js/tl.js"></script><link rel="shortcut icon" href="/assets/icon.svg" type="image/svg+xml">    <title>Somia - Bank sampah</title>

    <style>

    </style>
</head>

<body>
    <div class="w-full h-screen bg-stone-950 relative justify-center flex items-center">
        <main class=" absolute w-sm md:w-md aspect-[9/20]">
            <div class="swiper w-full h-full">
                <div class="swiper-wrapper text-(--sand)">
                    <div class="swiper-slide bg-(--ink) !flex flex-col items-center text-center  justify-center">
                        <h2 class="text-[24pt] font-accent font-bold tracking-1">Wrapped kamu <br> September 2026</h2>
                        <p class="opacity-70 mt-2 text-sm tracking-wide">Geser untuk melihat lebih lanjut &rarr;</p>
                    </div>

                    <div
                        class="swiper-slide bg-(--clay) !flex flex-col items-center text-center  justify-center swiper-totalwaste">
                        <h2 class="text-2xl font-accent md:text-[20pt] text-center">Bulan ini kamu berhasil
                            memilah :
                        </h2>
                        <p class="text-[48pt] font-accent font-bold tracking-1" data-aos="fade-left" id="totalWaste">
                        </p>
                        <p class="opacity-80 mt-2 font-semibold text-lg tracking-wide">Kg terpilah</p>

                    </div>

                    <div
                        class="swiper-slide bg-(--moss) !flex flex-col items-center text-center  justify-center swiper-daystreak">
                        <h2 class="text-2xl font-accent md:text-[20pt] text-center">Bulan ini kamu berhasil
                            memilah :
                        </h2>
                        <p class="text-[48pt] font-accent font-bold tracking-1" data-aos="fade-left" id="streak">
                        </p>
                        <p class="opacity-80 mt-2 font-semibold text-lg tracking-wide">Hari beruntun</p>
                    </div>

                    <div class="swiper-slide bg-(--ink) !flex flex-col items-center text-center  justify-center swiper-badge">
                        <h2 class="text-2xl font-accent md:text-[20pt] text-center">Kamu adalah
                        </h2>
                        <p class="text-[28pt] font-accent font-bold tracking-1 items-center" data-aos="fade-left" id="streak">
                            <i class="fa-solid fa-crown text-(--turmeric) text-[28pt]"></i>
                            <span id="badge"></span>
                        </p>
                    </div>

                    <div class="swiper-slide bg-(--moss) !flex flex-col items-center text-center  justify-center">
                        <h2 class="text-2xl font-accent w-full font-bold tracking-1" id="summary"></h2>
                        <div class="flex gap-4">
                        <button class="flex-1 bg-(--ink) mt-4"> <i class="fa-solid fa-share mr-2  "></i>Bagikan</button>
                        <button class="flex-1 bg-(--ink) mt-4"> <i class="fa-solid fa-arrow-right mr-2" onclick="window.open('dashboard.html', '_self')"></i>Kembali</button>
                        </div>
                    </div>

                </div>

                <div class="swiper-button-prev !opacity-0 bg-white !h-full -translate-y-[50%]"></div>
                <div class="swiper-button-next !opacity-0 bg-white !h-full -translate-y-[50%]"></div>
                <div class="swiper-pagination "></div>
            </div>
        </main>

    </div>
    <script src="/lib/swiper/swiper-bundle.js"></script>
    <script src="/js/main.js"></script>
    <script src="/lib/gsap/gsap.min.js"></script>
    <script src="/lib/gsap/ScrambleTextPlugin.min.js"></script>
    <script>
        let swiper = new Swiper('.swiper', {
            grabCursor: 'fade',
            pagination: {
                el: '.swiper-pagination',
                type: 'progressbar',
                clickable: true
            },
            navigation: {
                nextEl: '.swiper-button-next',
                prevEl: '.swiper-button-prev'
            },
            on: {
                slideChange: function () {
                    let activeSlide = this.el.querySelectorAll('.swiper-slide')[this.activeIndex]
                    if (activeSlide.classList.contains('swiper-totalwaste')) {
                        let obj = { val: 0 }
                        gsap.to(obj, {
                            duration: 1.5,
                            val: inven.user.totalWaste,
                            ease: 'power2.out',
                            snap: { val: 0.1 },
                            onUpdate: () => {
                                document.getElementById('totalWaste').innerText = obj.val
                            }
                        })
                    }

                    if (activeSlide.classList.contains('swiper-daystreak')) {
                        let obj = { val: 0 }
                        gsap.to(obj, {
                            duration: 1.5,
                            val: inven.user.dayStreak,
                            ease: 'power2.out',
                            snap: { val: 1 },
                            onUpdate: () => {
                                document.getElementById('streak').innerText = obj.val
                            }
                        })
                    }

                     if (activeSlide.classList.contains('swiper-badge')) {
                        gsap.to('#badge', {duration: 2, scrambleText: inven.user.badge})
                     }
                }
            }
        })
        document.getElementById('summary').innerHTML = `${inven.user.totalWaste}kg &middot; ${inven.user.dayStreak} hari </br> <span> <i class="text-yellow-600 fa-solid fa-crown fa-lg"></i> ${inven.user.badge} </span>`

    </script>
</body>

</html>
