                    <div class="">
                        <p class="font-semibold mb-2">Berdasarkan kategori</p>

                </div>
                <button class="bg-(--turmeric) w-full font-bold mt-4  mx-auto">Terapkan filter</button>
            </div>

            <div id="artikel-wrap" class=" w-full grid grid-cols-2 lg:grid-cols-3 gap-4">
            </div>
        </section>
    </div>
    <footer class="bg-(--ink) py-4 text-(--sand) grid w-full">

            <div class="flex flex-col space-y-2 max-w-sm  " id="identitas">

                </a>
                <p class="pl-2 text-pretty ">Memilah sampah, memantau bank sampah, dan mengubah kebiasaan baik menjadi
                    jadi
                    reward </p>
                <hr>
                <a href="/views/logged/dashboard.html"

                <a href="/artikel.html"

                <a href="/views/logged/peta.html"

            </div>
            <div class="flex flex-col ">
                <h4 class="text-xl font-bold">Ikuti kami di</h4>
                <a href="#"
                    class="h-fit py-2 hover:bg-emerald-900 mt-4 p-2 transition duration-500 rounded ease-in-out cursor-pointer ">
                    <i class="fa-brands fa-instagram fa-xl mr-4"></i> Instagram</a>

                <a href="#"
                    class="h-fit py-2 hover:bg-emerald-900 mt-4 p-2 transition duration-500 rounded ease-in-out cursor-pointer ">
                    <i class="fa-brands fa-facebook fa-xl mr-4"></i> Facebook</a>

                <a href="#"
                    class="h-fit py-2 hover:bg-emerald-900 mt-4 p-2 transition duration-500 rounded ease-in-out cursor-pointer ">
                    <i class="fa-brands fa-tiktok fa-xl mr-4"></i> Tiktok</a>

                <a href="#"

    <script src="/js/main.js"></script>
    <script src="/lib/swiper/swiper-bundle.js"></script>
    <script>

        let swiper = new Swiper('.mySwiper', {
            effect: 'fade',
            loop: true,
            autoplay: {
                delay: 3000,
                disableOnInteraction: false
            },
            pagination: {
                clickable: true,
                el: '.swiper-pagination'
            }
        })


        const renderAllCard = () => {
            return inven.articles.map(a => {
                return `
            <div onclick="window.open('/artikel-detail.html?q=${a.id}', '_self')" class="card">
                    <img src="${a.thumbnail}">
                    <div class="card-text">
                        <h4 class="md:text-base font-extrabold text-sm ">${a.title}</h4>
                        <p class="text-pretty line-clamp-1 opacity-90 text-xs md:text-sm">${a.excerpt}</p>
                    </div>
                </div>
            `
            }).join('')
        }

        const renderCardRecomend = () => {
            let result = inven.articles.slice(3,6)
            return result.map(f => `
                   <div class="card swiper-slide cursor-pointer" onclick="window.open('/artikel-detail.html?q=${f.id}', '_self')" >
                    <img class="" src="${f.thumbnail}" alt="">
                    <h3 class="md:text-base font-semibold">
                    ${f.title}</h3>
                </div>
                `).join('')
        }

        document.getElementById("card-recomend").innerHTML = renderCardRecomend()
        document.getElementById("artikel-wrap").innerHTML = renderAllCard()
        let cardSwiper = new Swiper('#container-cards', {
            slidesPerView: 2
        })
    </script>
</body>
